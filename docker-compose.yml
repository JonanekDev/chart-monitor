services:
  trivy:
    image: aquasec/trivy:0.76.2
    restart: unless-stopped
    command: server --listen 0.0.0.0:4954
    volumes:
      - trivy_cache:/root/.cache/trivy

  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: file:/data/chart-monitor.db
      TRIVY_SERVER_URL: http://trivy:4954
      # Self-hosted git / Helm repos with an internal CA: mount its PEM below and uncomment
      # EXTRA_CA_CERTS: /certs/internal-ca.crt
    volumes:
      - backend_data:/data
      # - ./certs/internal-ca.crt:/certs/internal-ca.crt:ro
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      - trivy

volumes:
  backend_data:
  trivy_cache:
