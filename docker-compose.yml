services:
  trivy:
    image: aquasec/trivy:0.76.2
    restart: unless-stopped
    command: server --listen 0.0.0.0:4954
    volumes:
      - trivy_cache:/root/.cache/trivy

  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: file:/data/chart-monitor.db
      TRIVY_SERVER_URL: http://trivy:4954
      # Self-hosted git / Helm repos with an internal CA: mount its PEM below and uncomment
      # EXTRA_CA_CERTS: /certs/internal-ca.crt
      # Private registries (image tags, OCI charts, trivy pulls): a Docker config.json with "auths"
      # DOCKER_CONFIG: /secrets/docker
    volumes:
      - backend_data:/data
      # - ./certs/internal-ca.crt:/certs/internal-ca.crt:ro
      # - ./secrets/docker/config.json:/secrets/docker/config.json:ro
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      - trivy

  # Private registry + ChartMuseum to test logins against (dev/auth-test/setup.sh first, then
  # docker compose -f docker-compose.yml -f dev/auth-test/app.yaml --profile auth-test up -d)
  auth-registry:
    image: registry:2.8.3
    profiles: [auth-test]
    environment:
      REGISTRY_HTTP_TLS_CERTIFICATE: /auth-test/server.crt
      REGISTRY_HTTP_TLS_KEY: /auth-test/server.key
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: auth-test
      REGISTRY_AUTH_HTPASSWD_PATH: /auth-test/htpasswd
    volumes:
      - ./dev/auth-test/generated:/auth-test:ro

  auth-chartmuseum:
    image: ghcr.io/helm/chartmuseum:v0.16.2
    profiles: [auth-test]
    env_file:
      - path: dev/auth-test/generated/chartmuseum.env # BASIC_AUTH_PASS
        required: false
    environment:
      PORT: 8080
      STORAGE: local
      STORAGE_LOCAL_ROOTDIR: /charts
      BASIC_AUTH_USER: testuser
      TLS_CERT: /auth-test/server.crt
      TLS_KEY: /auth-test/server.key
    tmpfs:
      - /charts:mode=1777
    volumes:
      - ./dev/auth-test/generated:/auth-test:ro

  # Forgejo with a private GitOps repo using the private charts (the seed creates it):
  # add https://auth-git:3000/testuser/gitops.git
  auth-git:
    image: codeberg.org/forgejo/forgejo:11.0.7
    profiles: [auth-test]
    entrypoint: sh /work/forgejo.sh
    environment:
      FORGEJO__security__INSTALL_LOCK: 'true'
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__PROTOCOL: https
      FORGEJO__server__DOMAIN: auth-git
      FORGEJO__server__HTTP_PORT: 3000
      FORGEJO__server__ROOT_URL: https://auth-git:3000/
      FORGEJO__server__CERT_FILE: /auth-test/server.crt
      FORGEJO__server__KEY_FILE: /auth-test/server.key
      FORGEJO__server__DISABLE_SSH: 'true'
      FORGEJO__service__DISABLE_REGISTRATION: 'true'
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: 'true'
      FORGEJO__log__LEVEL: Warn
    volumes:
      - ./dev/auth-test:/work:ro
      - ./dev/auth-test/generated:/auth-test:ro

  auth-test-seed:
    image: alpine:3.20
    profiles: [auth-test]
    command: sh /work/seed.sh
    depends_on: [auth-registry, auth-chartmuseum, auth-git]
    volumes:
      - ./dev/auth-test:/work:ro
      - ./dev/auth-test/generated/git.env:/work/generated/git.env

volumes:
  backend_data:
  trivy_cache:
